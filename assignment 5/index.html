<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Popup Boxes Example</title>
    <style>
        body {
            padding-top: 150px;
            padding-left: 430px;
            text-align: center;
            font-style: oblique;
            background-color: rgb(66, 221, 221);
            background-image: url("download.jfif");
            background-size: cover;

        }

        #main {
            height: 470px;
            width: 400px;
            border: 1px solid black;
            border-radius: 20px;
            background-color: rgb(255, 255, 255);
            box-shadow: 0px 0px 10px gray;
        }

        #heading {
            color: rgb(179, 39, 26);
            margin: 50px;
        }

        h3 {
            color: black;

        }

        #date {
            height: 30px;
            width: 300px;
            font-style: normal;
            margin-top: 10px;
            border-radius: 5px;

        }

        button {

            padding: 10px 20px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <div id="main">
        <h2 id="heading">JavaScript Pop-up Boxes Example</h2>

      
        <h3>Display Current Date</h3>
        <input type="text" id="date" placeholder="Date will appear here">
        <br><br>
        <button onclick="displayDate()">Display Date</button>

        <br><br><br>

        
        <h3>Find Factorial</h3>
        <button onclick="findFactorial()">Calculate Factorial</button>
    </div>


    <script>

        function displayDate() {

    var d = new Date();

    var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    var day = days[d.getDay()];
    var month = months[d.getMonth()];
    var date = d.getDate();
    var year = d.getFullYear();

    var time = d.getHours() + ":" + d.getMinutes() + ":" + d.getSeconds();

    var fullDate = day + " " + month + " " + date + " " + year + " " + time;

    document.getElementById("date").value = fullDate;
}

        // Function to calculate factorial
      function findFactorial() {

    var n = prompt("Enter a number");

    // Check if input is empty, null, or not a number
    if (n === null || n.trim() === "" || isNaN(n)) {
        alert("Invalid Input");
        return;
    }

    n = parseInt(n);

    if (n < 0) {
        alert("Invalid Input");
        return;
    }

    var fact = 1;

    for (var i = 1; i <= n; i++) {
        fact = fact * i;
    }

    alert("Factorial of " + n + " is " + fact);
}

      

    </script>

</body>

</html>
