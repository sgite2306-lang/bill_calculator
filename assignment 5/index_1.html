<!DOCTYPE html>
<html>
<head>
<title>JavaScript Pop-up Example</title>

<style>
body{
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    text-align: center;
}

.container{
    width: 400px;
    margin: 100px auto;
    padding: 20px;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0px 0px 10px gray;
}

h2{
    color: #333;
}

input{
    width: 90%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 5px;
    border: 1px solid gray;
}

button{
    padding: 10px 20px;
    margin-top: 15px;
    border: none;
    background-color: #007BFF;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

button:hover{
    background-color: #0056b3;
}
</style>

<script>

// Function to display current date
function displayDate(){
    var today = new Date();
    document.getElementById("datebox").value = today;
}

// Function to calculate factorial
function factorial(){
    var n = prompt("Enter a number");
    var fact = 1;

    for(var i=1;i<=n;i++){
        fact = fact * i;
    }

    alert("Factorial of " + n + " is " + fact);
}

</script>

</head>

<body>

<div class="container">

<h2>JavaScript Pop-up Demo</h2>

<!-- Part A -->
<input type="text" id="datebox" placeholder="Date will appear here">
<br>
<button onclick="displayDate()">Display Date</button>

<br><br>

<!-- Part B -->
<button onclick="factorial()">Calculate Factorial</button>

</div>

</body>
</html>
